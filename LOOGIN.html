```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerLaunch AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #D8F3DC, #F7FAF7);
            color: #12372A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: #12372A;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 2px 10px rgba(18, 55, 42, 0.12);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #95D5B2;
        }

        .nav-link {
            color: #12372A;
            background: #D8F3DC;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-link:hover {
            background: #B7E4C7;
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid #E2EDE4;
            border-radius: 16px;
            box-shadow: 0 8px 35px rgba(18, 55, 42, 0.10);
        }

        .login-card h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            color: #12372A;
        }

        .subtitle {
            text-align: center;
            color: #647568;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #244B37;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #DCE8DE;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            color: #12372A;
            background: #FFFFFF;
        }

        input::placeholder {
            color: #8A9A8E;
        }

        input:focus {
            border-color: #40916C;
            box-shadow: 0 0 0 3px rgba(64, 145, 108, 0.14);
        }

        .forgot {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #2D6A4F;
            text-decoration: none;
            margin-top: -8px;
            margin-bottom: 22px;
        }

        .forgot:hover {
            color: #12372A;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2D6A4F;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1B4332;
            transform: translateY(-1px);
        }

        .signup-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #647568;
        }

        .signup-text a {
            color: #2D6A4F;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            color: #12372A;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #12372A;
            color: #E4F1E7;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            nav {
                padding: 18px 5%;
            }

            .logo {
                font-size: 19px;
            }

            .login-card {
                padding: 26px 20px;
            }

            .login-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="{{ url_for('home') }}" class="logo">
            CareerLaunch <span>AI</span>
        </a>

        <a href="{{ url_for('register') }}" class="nav-link">
            Create Account
        </a>
    </nav>

    <main class="main">
        <div class="login-card">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to continue your career journey with CareerLaunch AI.
            </p>

            <form action="{{ url_for('login') }}" method="POST">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <a href="#" class="forgot">Forgot Password?</a>

                <button type="submit" class="login-btn">
                    Login to Account
                </button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="{{ url_for('register') }}">Sign Up</a>
            </p>

        </div>
    </main>

    <footer>
        © 2026 CareerLaunch AI. All rights reserved.
    </footer>

</body>
</html>
```
